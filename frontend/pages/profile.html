<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - E-Health Records</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="container navbar-content">

            <div class="logo">
                E-Health Records
            </div>

            <div class="nav-links">
                <a href="#" id="dashboardLink">
                    Dashboard
                </a>

                <a href="records.html">
                    Medical Records
                </a>

                <button
                    id="logoutButton"
                    class="btn"
                    type="button"
                >
                    Logout
                </button>
            </div>

        </div>

    </nav>


    <main class="dashboard">

        <div class="container">

            <div class="dashboard-header">
                <h1>My Profile</h1>
                <p>View and update your personal information.</p>
            </div>

            <div class="card">

                <div id="message" class="message"></div>

                <form id="profileForm">

                    <div class="form-group">
                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            disabled
                        >
                    </div>


                    <div class="form-group">
                        <label for="dateOfBirth">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dateOfBirth"
                        >
                    </div>


                    <div class="form-group">
                        <label for="gender">
                            Gender
                        </label>

                        <select id="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="male">
                                Male
                            </option>

                            <option value="female">
                                Female
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone"
                            placeholder="Enter phone number"
                        >
                    </div>


                    <div class="form-group">
                        <label for="bloodGroup">
                            Blood Group
                        </label>

                        <select id="bloodGroup">

                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="allergies">
                            Allergies
                        </label>

                        <textarea
                            id="allergies"
                            placeholder="Enter known allergies"
                        ></textarea>
                    </div>


                    <h3 style="margin: 25px 0 15px;">
                        Emergency Contact
                    </h3>


                    <div class="form-group">
                        <label for="emergencyName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="emergencyName"
                        >
                    </div>


                    <div class="form-group">
                        <label for="emergencyPhone">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="emergencyPhone"
                        >
                    </div>


                    <div class="form-group">
                        <label for="emergencyRelationship">
                            Relationship
                        </label>

                        <input
                            type="text"
                            id="emergencyRelationship"
                            placeholder="e.g. Father, Mother, Brother"
                        >
                    </div>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Save Profile
                    </button>

                </form>

            </div>

        </div>

    </main>


    <script src="../js/api.js"></script>
    <script src="../js/profile.js"></script>

</body>

</html>
