<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - E-Health Records</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h2>Create Account</h2>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" required>
                        <option value="patient">
                            Patient
                        </option>

                        <option value="doctor">
                            Doctor
                        </option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="btn"
                >
                    Register
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
